{% extends "base.html" %}
{% block title %}BusBoard - Account{% endblock %}
{% block content %}
<div class="card">
  <h2>Admin Account</h2>
  <p class="muted">Username: {{ config.admin.username }}</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="current_password">Current password</label>
    <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
    <label for="new_password">New password</label>
    <input type="password" id="new_password" name="new_password" autocomplete="new-password" required minlength="8">
    <label for="confirm_password">Confirm new password</label>
    <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required minlength="8">
    <button type="submit">Change password</button>
  </form>
</div>

<div class="card">
  <form method="post" action="{{ url_for('admin_logout') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" style="background:#991b1b;">Log out</button>
  </form>
</div>
{% endblock %}
